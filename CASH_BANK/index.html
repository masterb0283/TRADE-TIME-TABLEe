<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>International Banking UI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <div class="header">
            <h1>Hi, <span id="userName" class="editable">ZORIANA</span></h1>
            <div class="avatar" id="avatar">ZS</div>
        </div>

        <!-- CHECKING CARD -->
        <div class="checking-card">
            <div>
                <div class="account-type">TotalCash Bank</div>
                <div class="account-number"> •••• 590018</div>
            </div>
            <div class="balance">
                <div class="amount" id="balanceAmount">$7,750:00</div>
                <div class="available">Available Balance</div>
            </div>
        </div>
        <!-- ACTION BUTTONS -->
        <div class="actions">
            <button onclick="transferMoney()">
                <i class="fas fa-arrow-right-arrow-left"></i>
                <span>Transfer</span>
            </button>

            <button onclick="depositMoney()">
                <i class="fas fa-download"></i>
                <span>Deposit</span>
            </button>

            <button onclick="payMoney()">
                <i class="fas fa-money-check-dollar"></i>
                <span>Pay</span>
            </button>

            <button onclick="exchangeMoney()">
                <i class="fas fa-coins"></i>
                <span>Exchange</span>
            </button>
        </div>

        <!-- ALERT AREA -->
        <div id="alerts"></div>

        <!-- TRANSACTIONS -->
        <div class="transactions">
            <div class="transactions-header">
                <h2>Recent Credits</h2>
            </div>

            <div id="transactionList"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
