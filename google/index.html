<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Google</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      justify-content: flex-end;
      padding: 15px 20px;
      font-size: 13px;
    }

    .header a {
      color: #000;
      text-decoration: none;
      padding: 0 10px;
    }

    .header a:hover {
      text-decoration: underline;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 150px;
    }

    .logo {
      margin-bottom: 30px;
    }

    .search-container {
      width: 580px;
      max-width: 90%;
      position: relative;
    }

    .search-bar {
      width: 100%;
      padding: 14px 45px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      font-size: 16px;
      outline: none;
    }

    .search-bar:hover,
    .search-bar:focus {
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
    }

    .search-icons {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      right: 15px;
      display: flex;
      gap: 15px;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 15px;
    }

    .search-btn {
      background: #f8f9fa;
      border: 1px solid #f8f9fa;
      padding: 10px 20px;
      border-radius: 4px;
      color: #3c4043;
      cursor: pointer;
      font-size: 14px;
    }

    .search-btn:hover {
      border: 1px solid #dadce0;
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    }

    .footer {
      background: #f2f2f2;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #70757a;
    }

    .footer a {
      color: #70757a;
      text-decoration: none;
      padding: 0 15px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    #search-result {
      margin-top: 30px;
      text-align: center;
    }

    #search-result img {
      max-width: 200px;
      border-radius: 10px;
      margin-top: 15px;
    }

    @media (max-width: 768px) {
      .buttons {
        flex-direction: column;
        width: 90%;
      }

      .search-btn {
        width: 100%;
      }
    }
  </style>

  <script>
    function handleSearch() {
      const input = document.querySelector(".search-bar").value.trim().toLowerCase();
      const resultDiv = document.getElementById("search-result");

      if (input === "who is the most beautiful girl ?") {
        resultDiv.innerHTML = `
          <div>
            <p style="font-size: 20px; font-weight: bold; color: green;">
              OLOWO FERANMI TOSIN IS THE MOST BEAUTIFUL GIRL IN THE WORLD, <br>BASAED ON HER ADORABLE SMILE, HER REMARKABLE FACIAL SYMMETRY  <br>EVEN HER INTELLIGENCE CONTRIBUTES TO HER BEAUTY.<br>

            </p><br>
            <h2>FERANMI IS UNDOUBTEDLY THE MOST BEAUTIFUL WOMAN ON EARTH. </h2>
            
            <img src="feranmi pic.jpg" alt="Most Beautiful Girl">
          </div>
        `;
      } else {
        resultDiv.innerHTML = `<p style="color: red;">No matching results found.</p>`;
      }
    }
  </script>
</head>
<body>
  <!-- Header -->
  <nav class="header">
    <a href="#">Gmail</a>
    <a href="#">Images</a>
    <a href="#">⋮</a>
    <a href="#" style="background: #1a73e8; color: white; padding: 8px 24px; border-radius: 4px;">Sign in</a>
  </nav>

  <!-- Main -->
  <main class="main">
    <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo" class="logo">
    
    <div class="search-container">
      <input type="text" class="search-bar" placeholder="Search Google or type a URL">
      <div class="search-icons">
        <span class="material-icons">mic</span>
        <span class="material-icons">photo_camera</span>
      </div>
    </div>

    <div class="buttons">
      <button class="search-btn" onclick="handleSearch()">Google Search</button>
      <button class="search-btn">I'm Feeling Lucky</button>
    </div>

    <!-- Search Result Output -->
    <div id="search-result"></div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div>
      <a href="#">About</a>
      <a href="#">Advertising</a>
      <a href="#">Business</a>
    </div>
    <div>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Settings</a>
    </div>
  </footer>
</body>
</html>
