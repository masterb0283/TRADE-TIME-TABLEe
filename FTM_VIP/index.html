<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Access Page</title>
<style>
    body {
        background-color: #0b1a0b;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        color: #000;
    }

    .container {
        background-color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 20px;
    }

    h1 {
        color: #004d00;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    h2 {
        color: #004d00;
        font-size: 18px;
        font-weight: bold;
        margin: 0;
    }

    .instruction {
        color: #c70000;
        font-size: 18px;
        font-weight: bold;
        margin: 30px 0 20px;
    }

    input {
        width: 80%;
        max-width: 300px;
        padding: 10px;
        font-size: 16px;
        border: 2px solid #004d00;
        border-radius: 5px;
        outline: none;
        text-align: center;
    }

    button {
        margin-top: 20px;
        padding: 10px 25px;
        background-color: #004d00;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #006600;
    }

    .message {
        margin-top: 15px;
        font-weight: bold;
    }
</style>
</head>
<body>

<div class="container">
    <h1>WELCOME TO</h1>
    <h2>VIP ACCESS PORTAL</h2>
    <p class="instruction">Input your Access Code to continue</p>
    <input type="password" id="accessCode" placeholder="Enter Access Code">
    <button onclick="verifyAccess()">Continue</button>
    <p id="message" class="message"></p>
</div>

<script>
    function verifyAccess() {
        const input = document.getElementById('accessCode').value.trim();
        const message = document.getElementById('message');

        // You can set your desired access code here:
        const correctCode = "VIP2025";

        if (input === correctCode) {
            message.style.color = "green";
            message.textContent = "Access Granted ✅ Redirecting...";
            setTimeout(() => {
                window.location.href = "home.html"; // change to your next page
            }, 1500);
        } else {
            message.style.color = "red";
            message.textContent = "Invalid Access Code ❌";
        }
    }
</script>

</body>
</html>
