<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Home Page</title>
<style>
    body {
        background-color: #0b1a0b;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        color: #000;
    }

    .container {
        background-color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 20px;
    }

    h1 {
        color: #004d00;
        font-size: 22px;
        margin-bottom: 15px;
    }

    p {
        font-size: 17px;
        line-height: 1.6;
        margin: 10px 0;
        color: #111;
        max-width: 500px;
    }

    .highlight {
        color: #b30000;
        font-weight: bold;
    }

    .footer {
        margin-top: 30px;
        color: #004d00;
        font-weight: bold;
        font-size: 16px;
    }

    button {
        margin-top: 25px;
        padding: 10px 25px;
        background-color: #004d00;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #006600;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Welcome Dear Customer</h1>
    <p>This is a <span class="highlight">special platform</span> for <strong>VIP members only.</strong></p>
    <p>Games on this website are strictly <span class="highlight">correct score only</span> and are <strong>100% guaranteed.</strong></p>
    <p class="footer">Contact the admin if you have any questions or difficulties in placing your bet.</p>
    <button onclick="logout()">Logout</button>
</div>

<script>
    function logout() {
        window.location.href = "index.html"; // returns user to access page
    }
</script>

</body>
</html>
